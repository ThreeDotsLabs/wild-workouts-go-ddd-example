name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  backend:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build images
        run: |
          task docker:build SERVICE=trainer PROJECT_ID="$PROJECT_ID"
          task docker:build SERVICE=trainings PROJECT_ID="$PROJECT_ID"
          task docker:build SERVICE=users PROJECT_ID="$PROJECT_ID"

      - name: Push images
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          task docker:push SERVICE=trainer PROJECT_ID="$PROJECT_ID"
          task docker:push SERVICE=trainings PROJECT_ID="$PROJECT_ID"
          task docker:push SERVICE=users PROJECT_ID="$PROJECT_ID"

      - name: Deploy to Cloud Run
        run: |
          task deploy SERVICE=trainer SERVER=http PROJECT_ID="$PROJECT_ID"
          task deploy SERVICE=trainer SERVER=grpc PROJECT_ID="$PROJECT_ID"
          task deploy SERVICE=trainings SERVER=http PROJECT_ID="$PROJECT_ID"
          task deploy SERVICE=users SERVER=http PROJECT_ID="$PROJECT_ID"
          task deploy SERVICE=users SERVER=grpc PROJECT_ID="$PROJECT_ID"

  web:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build web
        working-directory: web
        env:
          # webpack 4 uses a hash algorithm removed from OpenSSL 3 (Node 17+)
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          yarn install
          yarn build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: npx firebase-tools@13 deploy --project "$PROJECT_ID"
