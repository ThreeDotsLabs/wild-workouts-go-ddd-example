version: '3'

tasks:
  default:
    cmds:
      - task: generate
      - task: render

  generate:
    env:
      FIRESTORE_EMULATOR_HOST: fake:8787
      TRAINER_GRPC_ADDR: fake:3000
      USERS_GRPC_ADDR: fake:3001
    cmds:
      - go mod tidy
      - rm -rf out
      - mkdir out
      - go run .

  render:
    cmds:
      - if ! type plantuml >/dev/null; then echo "Please install plantuml to generate PNG diagrams automatically"; fi
      - for f in out/*.plantuml; do plantuml "$f"; done
