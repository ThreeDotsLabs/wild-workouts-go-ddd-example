name: 'wild-workouts'
services:
  web:
    build:
      context: docker/web
      dockerfile: Dockerfile
    working_dir: /web
    volumes:
      - ./web:/web
      - /web/node_modules/
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    environment:
      VUE_APP_TRAINER_HTTP_PORT: ${TRAINER_HTTP_PORT:-3000}
      VUE_APP_TRAININGS_HTTP_PORT: ${TRAININGS_HTTP_PORT:-3001}
      VUE_APP_USERS_HTTP_PORT: ${USERS_HTTP_PORT:-3002}

  trainer-http:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
#      - ./service-account-file.json:$SERVICE_ACCOUNT_FILE
    working_dir: /internal
    ports:
      - "127.0.0.1:${TRAINER_HTTP_PORT:-3000}:$PORT"
    env_file:
      - .env
    environment:
      SERVICE: trainer
      SERVER_TO_RUN: http
      GOCACHE: /go-cache
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
    depends_on:
      - firestore

  trainer-grpc:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
#      - ./service-account-file.json:$SERVICE_ACCOUNT_FILE
    working_dir: /internal
    ports:
      - "127.0.0.1:${TRAINER_GRPC_PORT:-3010}:$PORT"
    env_file:
      - .env
    environment:
      SERVICE: trainer
      SERVER_TO_RUN: grpc
      GOCACHE: /go-cache
    depends_on:
      - firestore

  trainings-http:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
#      - ./service-account-file.json:$SERVICE_ACCOUNT_FILE
    working_dir: /internal
    ports:
      - "127.0.0.1:${TRAININGS_HTTP_PORT:-3001}:$PORT"
    env_file:
      - .env
    environment:
      SERVICE: trainings
      GOCACHE: /go-cache
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
    depends_on:
      - firestore

  users-http:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
#      - ./service-account-file.json:$SERVICE_ACCOUNT_FILE
    working_dir: /internal
    ports:
      - "127.0.0.1:${USERS_HTTP_PORT:-3002}:$PORT"
    environment:
      SERVICE: users
      SERVER_TO_RUN: http
      GOCACHE: /go-cache
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-8080}
    env_file:
      - .env
    depends_on:
      - firestore

  users-grpc:
    build:
      context: docker/app
    volumes:
      - ./internal:/internal
      - ./.go/pkg:/go/pkg
      - ./.go-cache:/go-cache
#      - ./service-account-file.json:$SERVICE_ACCOUNT_FILE
    working_dir: /internal
    ports:
      - "127.0.0.1:${USERS_GRPC_PORT:-3020}:$PORT"
    environment:
      SERVICE: users
      SERVER_TO_RUN: grpc
      GOCACHE: /go-cache
    env_file:
      - .env
    depends_on:
      - firestore

  firestore:
    build:
      context: docker/firestore-emulator
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FIRESTORE_PORT:-8787}:8787"
      - "127.0.0.1:${FIRESTORE_UI_PORT:-4000}:4000"
    restart: unless-stopped

  firestore-component-tests:
    build:
      context: docker/firestore-emulator
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FIRESTORE_COMPONENT_PORT:-8788}:8787"
    restart: unless-stopped

  mysql:
    image: mariadb:10
    env_file:
      - .env
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
